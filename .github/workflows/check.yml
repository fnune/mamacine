name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@2169fa61d1af74311533f54e6356cf41ea7b3b84
        with:
          cache-paths: |
            .cargo/registry
            .cargo/git
            .npm
            ./target
          cache-key-files: Cargo.lock
          command: |
            npm ci
            just check
